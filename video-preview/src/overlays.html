<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Движ-Патруль · подписи ролика</title>
    <link rel="stylesheet" href="../assets/fonts.css" />
    <style>
      /* ─────────────────────────────────────────────────────────
         Подписи и подложка ролика.

         Страница рисуется в 1080×1920 и снимается с прозрачным
         фоном: ffmpeg накладывает готовые PNG поверх записи экрана.
         Так подписи набраны тем же Unbounded, что и интерфейс, а не
         системным шрифтом drawtext.

         Всё держится в безопасной зоне вертикальных площадок:
         сверху 260 px, снизу 400 px не занимаем — там живут
         элементы Stories, Reels и TikTok.
         ───────────────────────────────────────────────────────── */

      :root {
        --canvas: #060609;
        --panel: #121216;
        --ink: #f5f5f1;
        --muted: #a3a3a8;
        --signal: #ff00b3;
        --hairline: #404045;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: 'Onest', system-ui, sans-serif;
        color: var(--ink);
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        position: relative;
        width: 1080px;
        height: 1920px;
      }

      /* ─── Подложка под экраном телефона ─────────────────────── */

      body.plate {
        background: var(--canvas);
      }

      .plate .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(80% 55% at 50% 42%, rgba(255, 0, 179, 0.09), transparent 70%),
          linear-gradient(to right, rgba(245, 245, 241, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245, 245, 241, 0.045) 1px, transparent 1px),
          var(--canvas);
        background-size:
          100% 100%,
          60px 60px,
          60px 60px,
          100% 100%;
      }

      /* Рамка вокруг записи экрана: волосяная линия системы. */
      .plate .cut {
        position: absolute;
        left: 117px;
        top: 45px;
        width: 846px;
        height: 1830px;
        border: 1px solid var(--hairline);
      }

      .plate .tick {
        position: absolute;
        width: 2px;
        height: 34px;
        background: var(--signal);
      }

      /* ─── Подпись ───────────────────────────────────────────── */

      .caption {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 268px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
      }

      .caption.top {
        bottom: auto;
        top: 232px;
      }

      .caption.mid {
        bottom: auto;
        top: 50%;
        transform: translateY(-50%);
        align-items: center;
        text-align: center;
      }

      .bar {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 18px 26px;
        /* Плашка непрозрачная: под ней идёт интерфейс, и любая
           прозрачность превращает подпись в кашу. */
        background: #060609;
        border-left: 4px solid var(--signal);
      }

      .bar b {
        display: block;
        font-family: 'Unbounded', sans-serif;
        font-weight: 700;
        font-size: 46px;
        line-height: 1.02;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }

      .bar.small b {
        font-size: 34px;
      }

      .bar i {
        display: block;
        margin-bottom: 10px;
        font-style: normal;
        font-family: 'Unbounded', sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--signal);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .chip {
        padding: 10px 18px;
        background: #060609;
        border: 1px solid var(--hairline);
        font-family: 'Unbounded', sans-serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .chip.signal {
        border-color: var(--signal);
        color: var(--signal);
      }

      .score {
        display: inline-flex;
        align-items: baseline;
        gap: 14px;
        padding: 16px 26px;
        background: var(--signal);
        color: #060609;
      }

      .score b {
        font-family: 'Unbounded', sans-serif;
        font-weight: 700;
        font-size: 62px;
        letter-spacing: -0.04em;
      }

      .score span {
        font-family: 'Unbounded', sans-serif;
        font-weight: 600;
        font-size: 24px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="frame" id="frame"></div>

    <script>
      // ═══ Что рисуем ══════════════════════════════════════════
      //
      // Тексты — только то, что действительно есть в приложении:
      // 45 заданий в пуле, 160 баллов у задания №22, три типа
      // карточек. Ни одной цифры «для красоты».

      const CAPTIONS = {
        plate: null,

        // На экране входа и так тесно: оставляем только два чипа,
        // крупная строка закрыла бы кнопку.
        join: { position: 'top', chips: ['6 символов', 'без аккаунта'], title: '' },
        team: { title: 'Твоя команда.\nТвой маршрут.' },
        photo: { kicker: 'Тип карточки', title: 'Фото-повторы' },
        pool: { kicker: 'В пуле', title: '45 заданий', chips: ['загадки', 'фото', 'активы'] },
        riddle: { kicker: 'Тип карточки', title: 'Загадки' },
        choose: { title: 'Выбирай,\nчто выполнять' },
        route: { kicker: 'Leipzig · игровое поле', title: 'Маршрут\nвыбираете вы' },
        send: { title: 'Отправка' },
        review: { title: 'Проверка' },
        admin: { position: 'top', small: true, title: 'Организатор\nподтверждает' },
        scored: { title: 'Засчитано', score: ['+160', 'баллов'] },
        board: { title: 'Рейтинг\nв реальном времени' },
      };

      function render(name) {
        const frame = document.getElementById('frame');

        if (name === 'plate') {
          document.body.classList.add('plate');
          frame.innerHTML =
            '<div class="bg"></div><div class="cut"></div>' +
            '<div class="tick" style="left:117px;top:11px"></div>' +
            '<div class="tick" style="right:117px;bottom:11px"></div>';
          return;
        }

        const data = CAPTIONS[name];
        if (!data) throw new Error(`нет подписи ${name}`);

        const lines = data.title ? data.title.split('\n').join('<br />') : '';
        const chips = (data.chips ?? [])
          .map((text, index) => `<span class="chip${index === 0 ? ' signal' : ''}">${text}</span>`)
          .join('');

        frame.innerHTML = `
          <div class="caption ${data.position ?? ''}">
            ${chips ? `<div class="chips">${chips}</div>` : ''}
            ${
              lines
                ? `<div class="bar${data.small ? ' small' : ''}">
                     <div>
                       ${data.kicker ? `<i>${data.kicker}</i>` : ''}
                       <b>${lines}</b>
                     </div>
                   </div>`
                : ''
            }
            ${
              data.score
                ? `<div class="score"><b>${data.score[0]}</b><span>${data.score[1]}</span></div>`
                : ''
            }
          </div>
        `;
      }

      window.__render = render;
      render(new URLSearchParams(location.search).get('name') ?? 'plate');
    </script>
  </body>
</html>
